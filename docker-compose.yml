services:
  identity-db:
    image: postgres:16
    container_name: helpdesk_identity_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD: identity_password
    ports:
      - "5433:5432"
    volumes:
      - identity_data:/var/lib/postgresql/data

  ticket-db:
    image: postgres:16
    container_name: helpdesk_ticket_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket_db
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_password
    ports:
      - "5434:5432"
    volumes:
      - ticket_data:/var/lib/postgresql/data

  notification-db:
    image: postgres:16
    container_name: helpdesk_notification_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_password
    ports:
      - "5435:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: kalo
      RABBITMQ_DEFAULT_PASS: kalo
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]." 

volumes:
  identity_data:
  ticket_data:
  notification_data:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local